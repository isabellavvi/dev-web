<!DOCTYPE html>
<html lang="Pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula 3</title>
   
</head>
    <body>

      <form action="#" method="post">
       
        <label for="nome">nome</label>
        <input type="text" id="nome" placeholder="seu nome..." required>
        <br><br>
        <label for="email">email</label>
        <input type="email" id="email" placeholder="seuemail@gmail.com">
        <br><br>
        <label for="senha">senha: </label>
        <input type="password" id="senha" required>
        <br><br>
        <label for="menssagem">menssagem</label>
        <textarea name="menssagem" id="menssagem" rows="2" cols="20" placeholder="escreva aqui..."></textarea>
        <br><br>
        <label for="cidade">cidade:</label>
        <select name="cidade" id="cidade">
            <option value="nh">novo hamburgo</option>
            <option value="sl">sao leopoldo</option>
            <option value="cb">campo bom </option>
            <option value="mgo">montenegro</option>
        </select>
        
        <fieldset>
          <legend>gênero</legend>
          <input type="radio" id="masc" name="genero" value="M">
          <label for="masc">Masculino</label>
          <input type="radio" id="fem" name="genero" value="F">
          <label for="fem">Feminino</label>
        </fieldset>
      </form>   

    </body>
</html>
